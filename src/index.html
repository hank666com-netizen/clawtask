<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ClawTask</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'hygge-beige': '#F7F3F0',
            'hygge-moss': '#6B705C',
            'hygge-sage': '#A5A58D',
            'hygge-brown': '#B7B7A4',
            'hygge-earth': '#6D5959',
            'hygge-warm-grey': '#DDBEA9',
            'hygge-stone': '#CB997E',
            'hygge-nav': '#A39E93',
          }
        }
      }
    }
  </script>
  <style>
    /* Custom accent color using CSS variable */
    .bg-accent { background-color: var(--color-accent, #6B705C); }
    .bg-accent-20 { background-color: var(--color-accent, #6B705C); opacity: 0.2; }
    .text-accent { color: var(--color-accent, #6B705C); }
    .text-accent-hover:hover { color: var(--color-accent, #6B705C); }
    .accent-outline { outline: 2px solid var(--color-accent, #6B705C); outline-offset: 2px; }
    .ring-accent { box-shadow: 0 0 0 4px var(--color-accent, #6B705C); }
    .ring-offset-accent { box-shadow: 0 0 0 2px white, 0 0 0 6px var(--color-accent, #6B705C); }
    .nav-active { background-color: var(--color-accent, #6B705C); color: white !important; }
    .nav-inactive { color: var(--color-accent, #6B705C); }

    /* Custom styles for features Tailwind doesn't have */
    .bg-hygge-brown-30 { background-color: rgba(183,183,164,0.3); }
    .bg-hygge-moss-20 { background-color: rgba(107,112,92,0.2); }
    .bg-hygge-moss-10 { background-color: rgba(107,112,92,0.1); }
    .bg-hygge-warm-grey-30 { background-color: rgba(221,190,169,0.3); }
    .bg-hygge-earth-80 { background-color: rgba(109,89,89,0.8); }
    .bg-white-40 { background-color: rgba(255,255,255,0.4); }
    .bg-white-50 { background-color: rgba(255,255,255,0.5); }
    .bg-white-60 { background-color: rgba(255,255,255,0.6); }
    .bg-white-80 { background-color: rgba(255,255,255,0.8); }
    .bg-black-30 { background-color: rgba(0,0,0,0.3); }
    .text-hygge-moss-40 { color: rgba(107,112,92,0.4); }
    .text-hygge-moss-50 { color: rgba(107,112,92,0.5); }
    .text-hygge-moss-60 { color: rgba(107,112,92,0.6); }
    .text-hygge-moss-70 { color: rgba(107,112,92,0.7); }
    .text-accent-60 { color: rgba(107,112,92,0.6); }
    .border-hygge-brown-20 { border-color: rgba(183,183,164,0.2); }
    .border-hygge-brown-30 { border-color: rgba(183,183,164,0.3); }
    .hover-bg-white-40:hover { background-color: rgba(255,255,255,0.4); }
    .hover-bg-white-80:hover { background-color: rgba(255,255,255,0.8); }
    .hover-bg-white:hover { background-color: rgba(255,255,255,0.5); }
    .hover-bg-hygge-moss-10:hover { background-color: rgba(107,112,92,0.1); }
    .hover-bg-hygge-moss-80:hover { background-color: rgba(107,112,92,0.8); }
    .hover-text-hygge-moss:hover { color: #6B705C; }
    .hover-text-red-500:hover { color: #EF4444; }
    .hover-ring-2:hover { box-shadow: 0 0 0 2px #6B705C; }
    .cursor-grab { cursor: grab; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .soft-shadow { box-shadow: 0 4px 20px -2px rgba(107,112,92,0.1); }
    .min-w-0 { min-width: 0; }
    .size-12 { width: 3rem; height: 3rem; }
    .size-10 { width: 2.5rem; height: 2.5rem; }
    .size-8 { width: 2rem; height: 2rem; }

    /* Base body styles */
    body {
      background-color: #F7F3F0 !important;
      color: #6B705C !important;
      font-family: 'Outfit', sans-serif;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Dark mode - applied to html element */
    html.dark body { background-color: #1a1a1a !important; color: #DDBEA9 !important; }
    html.dark aside { background-color: rgba(30, 30, 30, 0.6); border-color: rgba(221, 190, 169, 0.1); }
    html.dark .bg-white-40, html.dark .bg-white-50, html.dark .bg-white-60 { background-color: rgba(50, 50, 50, 0.5); }
    html.dark .bg-hygge-beige { background-color: rgba(30, 30, 30, 0.6); }
    html.dark .text-hygge-earth { color: #DDBEA9; }
    html.dark .text-hygge-moss-60 { color: rgba(221, 190, 169, 0.6); }
    html.dark .border-hygge-brown-20 { border-color: rgba(221, 190, 169, 0.1); }
  </style>
</head>
<body class="h-screen flex overflow-hidden">
  <!-- Sidebar -->
  <aside class="w-64 bg-hygge-brown bg-opacity-30 border-r border-hygge-brown-20 flex flex-col p-6 z-10">
    <div class="flex items-center gap-3 mb-8">
      <div class="size-12 bg-hygge-moss rounded-xl flex items-center justify-center text-white shadow-lg">
        <span class="material-symbols-outlined text-2xl">dashboard</span>
      </div>
      <div>
        <h1 class="text-xl font-bold text-hygge-earth tracking-tight">ClawTask</h1>
        <p class="text-xs text-hygge-moss-60">Task Board</p>
      </div>
    </div>

    <nav class="flex-1 space-y-2">
      <div class="nav-item flex items-center gap-3 px-4 py-3 rounded-2xl cursor-pointer transition-all nav-inactive hover-bg-white-40" data-view="board" onclick="switchView('board')">
        <span class="material-symbols-outlined">view_kanban</span>
        <span>Tasks</span>
      </div>
      <div class="nav-item flex items-center gap-3 px-4 py-3 rounded-2xl cursor-pointer transition-all nav-inactive hover-bg-white-40" data-view="heatmap" onclick="switchView('heatmap')">
        <span class="material-symbols-outlined">calendar_view_month</span>
        <span>Heatmap</span>
      </div>
      <div class="nav-item flex items-center gap-3 px-4 py-3 rounded-2xl cursor-pointer transition-all nav-inactive hover-bg-white-40" data-view="projects" onclick="switchView('projects')">
        <span class="material-symbols-outlined">folder</span>
        <span>Projects</span>
      </div>
      <div class="nav-item flex items-center gap-3 px-4 py-3 rounded-2xl cursor-pointer transition-all nav-inactive hover-bg-white-40" data-view="insights" onclick="switchView('insights')">
        <span class="material-symbols-outlined">analytics</span>
        <span>Insights</span>
      </div>
      <div class="nav-item flex items-center gap-3 px-4 py-3 rounded-2xl cursor-pointer transition-all nav-inactive hover-bg-white-40" data-view="settings" onclick="switchView('settings')">
        <span class="material-symbols-outlined">settings</span>
        <span>Settings</span>
      </div>
    </nav>

    <!-- Extra div removed - was causing HTML structure error -->
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto p-8 no-scrollbar bg-gradient-to-br from-hygge-beige to-white-50">
  </main>

  <script type="module" src="index.ts"></script>
</body>
</html>
